name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Concurrency is scoped PER JOB, not workflow-wide. A workflow-wide group meant
# the long manual `quickstart` run shared a group with ordinary push/PR runs on
# the same ref, so merging a PR to main cancelled an in-flight quickstart at ~20
# minutes. Superseding is right for `tests` and wrong for a job you deliberately
# started and want to finish.

env:
  # Gradio phones home on import unless this is set.
  GRADIO_ANALYTICS_ENABLED: "False"
  # No display on the runner; matplotlib is pulled in via the report path.
  MPLBACKEND: Agg
  # The suite asserts BO reproducibility, so keep hash ordering fixed too.
  PYTHONHASHSEED: "0"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A newer push to the same ref supersedes this one.
    concurrency:
      group: ${{ github.workflow }}-tests-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version the README's conda instructions install.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only torch
        # The default PyPI Linux wheel is 532 MB and drags in six nvidia/triton
        # packages (several GB) that a CPU runner never uses. The +cpu build has
        # none of them. The pin is READ FROM requirements.txt rather than
        # duplicated here, so there is one source of truth for the version.
        run: |
          set -euo pipefail
          TORCH_PIN=$(grep -E '^torch==' requirements.txt)
          echo "Installing $TORCH_PIN from the CPU index"
          pip install "$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        # Installs the exact file users are told to install, so a broken pin
        # fails here rather than in someone's first five minutes with the repo.
        # This caught two real breakages on its first run: an unsatisfiable
        # scipy pin, and pyarrow never being declared despite 18 parquet call
        # sites. torch is already satisfied — 2.12.1+cpu matches the ==2.12.1 pin.
        run: pip install -r requirements.txt

      - name: Report environment
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -c "import botorch, gpytorch, pyro, matminer, pymatgen, pyarrow, gradio; print('deps import OK')"

      - name: Run test suite
        # Several of these guard invariants that fail SILENTLY when broken —
        # the target-twin leak blocklist, BO reproducibility, the featurizer's
        # broadcast alignment, and webui schema dispatch. They are the reason
        # this workflow exists.
        run: python -m pytest tests/ -q --durations=10

      - name: End-to-end smoke (steps 1 → 5)
        # Unit tests never run the stages as a pipeline. ~25 s on CPU. See the
        # module docstring for why this is not the full README command.
        run: python scripts/ci_smoke.py

  # The exact command the README puts in front of a new user. Manual only:
  # it runs MOBO over an ~8k-row library at q=80, which is GPU-assisted on a
  # workstation (~2 min) but exceeded 12 minutes in step 5 alone on a 24-core
  # CPU box — a hosted two-core runner is worse. The `tests` job's smoke step
  # covers the same wiring in ~25 s; run this before a release, or when
  # changing step 5.
  quickstart:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Keyed on run_id, so this job is in a group of one and NOTHING cancels it:
    # not a push to the same ref, not another dispatch. You started it on
    # purpose and it takes tens of minutes; letting unrelated activity kill it
    # wastes the whole run.
    concurrency:
      group: ${{ github.workflow }}-quickstart-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only torch
        run: |
          set -euo pipefail
          TORCH_PIN=$(grep -E '^torch==' requirements.txt)
          pip install "$TORCH_PIN" --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the README quick-start
        # EDA and report are skipped because both need a local Ollama daemon.
        run: python run_pipeline.py --preset synthetic_catalyst --skip eda report

      - name: Confirm the quick-start produced discriminating candidates
        run: |
          python - <<'PY'
          import pandas as pd, sys
          from pathlib import Path
          p = Path("data/candidates.parquet")
          if not p.exists():
              sys.exit("step 5 produced no candidates.parquet")
          df = pd.read_parquet(p)
          preds = [c for c in df.columns if c.startswith("pred_")]
          print(f"{len(df)} candidates, prediction columns: {preds}")
          if df.empty or not preds:
              sys.exit("candidates.parquet is empty or has no predictions")
          primary = preds[0]
          if df[primary].round(9).nunique() == 1:
              sys.exit(f"all candidates share one predicted {primary} "
                       f"({df[primary].iloc[0]}) — surrogate posterior collapsed")
          PY
